<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employer Applications</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      :root {
        --primary-color: #4361ee;
        --primary-light: #4895ef;
        --primary-dark: #3f37c9;
        --secondary-color: #6c757d;
        --success-color: #10b981;
        --danger-color: #ef4444;
        --warning-color: #f59e0b;
        --info-color: #3b82f6;
        --gradient-primary: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
        --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
        --gradient-danger: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        --gradient-warning: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        --gradient-info: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --bg-tertiary: #f1f5f9;
        --text-primary: #0f172a;
        --text-secondary: #334155;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --card-shadow:
          0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --shadow-sm: 0 2px 4px rgba(139, 92, 246, 0.1);
        --shadow-md: 0 4px 6px rgba(139, 92, 246, 0.15);
        --shadow-lg: 0 10px 15px rgba(139, 92, 246, 0.2);
        --shadow-xl: 0 20px 25px rgba(139, 92, 246, 0.25);
        --hover-shadow:
          0 20px 25px -5px rgba(139, 92, 246, 0.25),
          0 10px 10px -5px rgba(139, 92, 246, 0.2);
        --font-primary: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-heading: "Poppins", "Inter", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-primary);
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        width: 100%;
      }
      .page-header {
        margin-bottom: 2rem;
      }
      .page-header h1 {
        font-size: 2rem;
        margin-bottom: 0.25rem;
      }
      .gradient-text {
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .text-muted {
        color: var(--text-muted);
      }

      .btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s;
        border: none;
        font-size: 1rem;
        line-height: 1;
        font-family: var(--font-primary);
      }
      .btn-primary {
        background: var(--gradient-primary);
        color: white;
        box-shadow: 0 4px 6px rgba(67, 97, 238, 0.25);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 10px rgba(67, 97, 238, 0.3);
      }
      .btn-secondary {
        background: var(--bg-tertiary);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }
      .btn-secondary:hover {
        background: var(--bg-secondary);
      }
      .btn-sm {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
      }

      .job-selector {
        margin-bottom: 2rem;
      }
      .job-selector label {
        font-weight: 500;
        margin-bottom: 0.5rem;
        display: block;
      }
      .select-wrapper {
        position: relative;
      }
      .select-wrapper select {
        appearance: none;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        width: 100%;
        max-width: 400px;
        font-size: 1rem;
        color: var(--text-primary);
        cursor: pointer;
      }
      .select-wrapper::after {
        content: "\f078";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        color: var(--text-muted);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1rem;
        text-align: center;
        transition: transform 0.2s;
      }
      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-sm);
      }
      .stat-value {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--primary-color);
      }
      .stat-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
      }

      .filters-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 2rem;
        align-items: center;
        justify-content: space-between;
      }
      .filter-group {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .filter-group label {
        font-size: 0.9rem;
        font-weight: 500;
      }
      .filter-select,
      .filter-input {
        padding: 0.5rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-size: 0.9rem;
      }
      .search-input {
        width: 250px;
      }

      .applications-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .application-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.25rem;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .application-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .applicant-info {
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .applicant-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--gradient-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-weight: 600;
        color: white;
      }
      .applicant-details h3 {
        margin: 0;
        font-size: 1.1rem;
      }
      .applicant-details p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .application-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        font-size: 0.85rem;
        color: var(--text-muted);
      }
      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 500;
      }
      .status-pending {
        background: #fef3c7;
        color: #92400e;
      }
      .status-reviewed {
        background: #dbeafe;
        color: #1e40af;
      }
      .status-shortlisted {
        background: #d1fae5;
        color: #065f46;
      }
      .status-rejected {
        background: #fee2e2;
        color: #991b1b;
      }
      .status-hired {
        background: #c7d2fe;
        color: #3730a3;
      }

      .card-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 0.5rem;
      }
      .status-select {
        padding: 0.4rem 0.8rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 0.85rem;
        cursor: pointer;
      }

      .loading-spinner {
        text-align: center;
        padding: 3rem;
      }
      .spinner {
        border: 3px solid var(--bg-tertiary);
        border-top: 3px solid var(--primary-color);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .empty-state {
        text-align: center;
        padding: 3rem;
        color: var(--text-muted);
      }
      .empty-state i {
        font-size: 3rem;
        margin-bottom: 1rem;
      }

      @media (max-width: 768px) {
        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .filters-row {
          flex-direction: column;
          align-items: stretch;
        }
        .filter-group {
          justify-content: space-between;
        }
        .search-input {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <h1 class="gradient-text">Applications Manager</h1>
        <p class="text-muted">
          Review and manage candidates who applied to your jobs
        </p>
      </div>

      <!-- Job selector -->
      <div class="job-selector">
        <label for="jobSelect">Select a job to view applications</label>
        <div class="select-wrapper">
          <select id="jobSelect">
            <option value="">-- Loading jobs... --</option>
          </select>
        </div>
      </div>

      <!-- Stats Cards -->
      <div id="statsContainer" class="stats-grid" style="display: none"></div>

      <!-- Filters Row -->
      <div class="filters-row" id="filtersRow" style="display: none">
        <div class="filter-group">
          <label>Status:</label>
          <select id="statusFilter" class="filter-select">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="reviewed">Reviewed</option>
            <option value="shortlisted">Shortlisted</option>
            <option value="rejected">Rejected</option>
            <option value="hired">Hired</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Search:</label>
          <input
            type="text"
            id="searchFilter"
            class="filter-input search-input"
            placeholder="Name or email..."
          />
        </div>
      </div>

      <!-- Applications Grid -->
      <div id="applicationsGrid" class="applications-grid"></div>
    </div>

    <script src="/js/employer/applications.js"></script>
  </body>
</html>
